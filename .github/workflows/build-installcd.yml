name: Build the CJK minimal installation CD

on:
  push:
    branches: [gentoo-cjk]
    paths:
      - '.github/workflows/build-installcd.yml'
      - 'docker/**'
      - 'releases/portage/isos-cjk/**'
      - 'releases/specs/amd64/installcd-cjk-*'
  workflow_dispatch:
  # The seed stage3 and the stable branch both move, so a weekly run keeps the
  # image current and catches upstream drift while it is still one change.
  # GitHub disables a schedule after 60 days without repository activity.
  schedule:
    - cron: '17 4 * * 1'

# Separate jobs, each capped at six hours. stage1 measured 1h22m on 2026-08-10,
# so this is headroom; rebuilding the image per job costs about seven minutes.
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the container image
        run: docker build -t gentoo-cjk-livecd -f docker/Dockerfile .

      - name: Resolve both package lists
        run: docker run --rm gentoo-cjk-livecd preflight

  stage1:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the container image
        run: docker build -t gentoo-cjk-livecd -f docker/Dockerfile .

      - name: Build livecd-stage1
        run: |
          sudo install -d /mnt/catalyst
          docker run --rm --privileged \
            -v /dev:/dev \
            -v /mnt/catalyst:/var/tmp/catalyst \
            gentoo-cjk-livecd stage1

      # The container writes as root and the upload step runs as the runner.
      - name: Make the storedir readable
        run: sudo chmod -R a+rX /mnt/catalyst

      - name: Upload the stage1 seed
        uses: actions/upload-artifact@v7
        with:
          name: livecd-stage1
          retention-days: 1
          # Already xz and squashfs; recompressing costs minutes and saves none.
          compression-level: 0
          path: |
            /mnt/catalyst/build.env
            /mnt/catalyst/snapshots/*.sqfs
            /mnt/catalyst/builds/23.0-default/livecd-stage1-*.tar.xz

  stage2:
    needs: stage1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the container image
        run: docker build -t gentoo-cjk-livecd -f docker/Dockerfile .

      # /mnt belongs to root and the download step runs as the runner.
      - name: Prepare the storedir
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/catalyst

      - name: Restore the stage1 seed
        uses: actions/download-artifact@v8
        with:
          name: livecd-stage1
          path: /mnt/catalyst

      - name: Build livecd-stage2
        run: |
          sudo install -d -m 0777 /mnt/output
          docker run --rm --privileged \
            -v /dev:/dev \
            -v /mnt/catalyst:/var/tmp/catalyst \
            -v /mnt/output:/output \
            gentoo-cjk-livecd stage2

      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: install-amd64-cjk-minimal
          # Longer than the weekly cadence, so one image is always downloadable.
          retention-days: 14
          compression-level: 0
          path: /mnt/output/*

  # An image that builds is not an image that boots, and only this job can tell
  # the two apart.
  boot-test:
    needs: stage2
    runs-on: ubuntu-latest
    outputs:
      kernel: ${{ steps.boot.outputs.kernel }}
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU and xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso
          # The runner has /dev/kvm but the runner user is not in the kvm group.
          sudo chmod 0666 /dev/kvm 2>/dev/null || echo "no /dev/kvm; qemu uses TCG"
          ls -l /dev/kvm 2>/dev/null || true

      - uses: actions/download-artifact@v8
        with:
          name: install-amd64-cjk-minimal
          path: iso

      # TCG needs far longer than the local default of ten minutes.
      - name: Boot the image
        id: boot
        run: |
          python3 tests/boot-test.py iso/*.iso --log boot-test.log --timeout 2400 >checks.txt
          sed -n 's/^ok    kernel: /kernel=/p' checks.txt >>"$GITHUB_OUTPUT"

      # A failing boot aborts the step above before its output is seen.
      - name: Show the checks
        if: always()
        run: cat checks.txt

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-log
          path: boot-test.log

  # The build was weekly and publishing was not, so an image could sit in an
  # artifact until it expired. A push builds for iteration and is not released.
  release:
    needs: boot-test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: install-amd64-cjk-minimal
          path: iso

      - name: Publish the image
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL: ${{ needs.boot-test.outputs.kernel }}
        run: |
          iso=$(ls iso/*.iso)
          tag=${iso##*/install-amd64-cjk-minimal-}
          tag=${tag%.iso}
          if [ -z "$KERNEL" ]; then
            echo "boot-test reported no kernel version"
            exit 1
          fi
          for asset in "$iso" "$iso".sha256 "$iso".DIGESTS "$iso".CONTENTS.gz; do
            if [ ! -f "$asset" ]; then
              echo "missing release asset: $asset"
              exit 1
            fi
          done
          # The volume identifier is 32 bytes at 0x8028 of the ISO9660 PVD.
          volid=$(dd if="$iso" bs=1 skip=32808 count=32 status=none \
                  | tr -d '\0' | sed 's/ *$//')
          size=$(( $(stat -c %s "$iso") / 1048576 ))
          # The tag is the tree snapshot, so a rerun on an unmoved tree would
          # rebuild an image already published.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists; the tree snapshot has not moved"
            exit 0
          fi
          printf '%s\n' \
            "Gentoo amd64 minimal installation CD, ${size} MiB, volume id \`${volid}\`." \
            "" \
            "Upstream's \`install-amd64-minimal\` with the kernel replaced by" \
            "\`${KERNEL}\`, cjktty patched, so the console renders CJK." \
            "" \
            "sha256sum -c ${iso##*/}.sha256" >notes.md
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gentoo CJK minimal installation CD $tag" \
            --notes-file notes.md \
            "$iso" "$iso".sha256 "$iso".DIGESTS "$iso".CONTENTS.gz
